name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # फिक्स: अक्सर gradlew फाइल को रन करने की परमिशन न होने से बिल्ड फेल होता है
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # फिक्स: पुराने प्रोजेक्ट्स में लिनक्स पर सीधे असेंबल करने की कमांड
    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tidy-Fixed-APK
        path: app/build/outputs/apk/debug/*.apk

